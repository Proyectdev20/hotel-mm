<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Iniciar Sesión - Hotel MM</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='login.css') }}">
</head>

<body>

    <div class="contenedor-login">
       
        <!-- Formulario -->

        <div class="seccion-formulario">

            <div class="login-box">

                <a href="/"
                   class="btn-volver">
                    ← Volver al inicio
                </a>

                <h2 class="titulo-login">
                    Bienvenido de nuevo
                </h2>

                <p class="subtitulo-login">
                    Administrador del Hotel
                </p>

                <form method="POST" action="/login">

                    <div class="grupo-input">

                        <label for="usuario">
                            Usuario
                        </label>

                        <input
                            type="text"
                            id="usuario"
                            name="usuario"
                            placeholder="Ingresar Usuario"
                            required>

                    </div>

                    <div class="grupo-input">

                        <label for="password">
                            Contraseña
                        </label>

                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="••••••••"
                            required>

                    </div>

                    <button
                        type="submit"
                        class="btn-login"> Acceder
                    </button>

                </form>

            </div>

        </div>

        <!-- Imagen -->

        <div class="seccion-imagen-login">

            <div class="overlay-imagen">

                <h3>
                    Panel de Administradores
                </h3>

            </div>

        </div>

    </div>

</body>

</html>
